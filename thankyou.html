<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Bedankt voor je bericht</title>
    <style>
        /* Algemene resets */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Gemunu Libre', sans-serif; /* Zelfde stijl als de rest van je site */
            background-color: #0B0C17; /* Donkere achtergrond voor consistentie */
            color: white; /* Witte tekst voor duidelijk contrast */
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 0 20px;
        }

        .thank-you-container {
            max-width: 600px;
            background-color: #1C1E2B;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: white;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #CCCCCC; /* Lichtgrijze tekst voor subtiele details */
        }

        .btn {
            display: inline-block;
            background-color: transparent;
            color: white;
            padding: 0.75rem 2rem;
            text-decoration: none;
            font-size: 1.2rem;
            border: 2px solid white;
            border-radius: 30px;
            transition: background-color 0.3s, color 0.3s;
        }

        .btn:hover {
            background-color: white;
            color: #0B0C17;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <h1>Bedankt voor je bericht!</h1>
        <p>Ik waardeer het dat je contact met me hebt opgenomen. Ik zal zo snel mogelijk reageren.</p>
        <a href="Portfolio.html" class="btn">Terug naar de homepagina</a>
    </div>
</body>
</html>
